name: Verify sources

on:
  push:
    paths: ["examples/**", "reports/**", "scripts/**"]
  pull_request:
    paths: ["examples/**", "reports/**", "scripts/**"]
  schedule:
    # 每周一 06:17 UTC 复检：外部链接会失效，文献不会，但页面会改版
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 校验各平台提示词长度上限
        run: python3 scripts/check_limits.py

      - name: 检查 install.sh 的变量名粘连
        # $VAR 紧跟全角字符时，bash 会把多字节字节并进变量名，
        # 在 set -u 下报 unbound variable。此 bug 已在本文件出现两次
        # （`$TGT_REAL）` 与 `$sop_src，`），故钉成闸门。
        run: |
          if grep -nP '\$[A-Za-z_][A-Za-z0-9_]*[\x{4e00}-\x{9fff}\x{3000}-\x{303f}\x{ff00}-\x{ffef}]' install.sh; then
            echo "::error::变量名后紧跟全角字符，须写成 \${VAR}（详见 install.sh 头部说明）"
            exit 1
          fi
          echo "✅ install.sh 无变量名粘连"

      - name: 核验器自身的回归自检
        # 先证明核验器不会误判，再用它去判别人
        run: python3 scripts/verify.py --self-test

      - name: 核验 dossier 引文与链接
        run: python3 scripts/verify.py --json examples/ reports/

      - name: 生成可视化核验报告
        if: always()
        run: python3 scripts/verify.py examples/ reports/ --html verify-report.html || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-report
          path: verify-report.html
