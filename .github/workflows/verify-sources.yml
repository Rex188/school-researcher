name: Verify sources

on:
  push:
    paths: ["examples/**", "reports/**", "scripts/**"]
  pull_request:
    paths: ["examples/**", "reports/**", "scripts/**"]
  schedule:
    # 每周一 06:17 UTC 复检：外部链接会失效，文献不会，但页面会改版
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查 SKILL.md description 长度（上限 1024）
        run: python3 scripts/check_skill.py

      - name: 核验器自身的回归自检
        # 先证明核验器不会误判，再用它去判别人
        run: python3 scripts/verify.py --self-test

      - name: 核验 dossier 引文与链接
        run: python3 scripts/verify.py --json examples/ reports/

      - name: 生成可视化核验报告
        if: always()
        run: python3 scripts/verify.py examples/ reports/ --html verify-report.html || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-report
          path: verify-report.html
